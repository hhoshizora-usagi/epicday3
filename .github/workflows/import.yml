name: import-site
on:
  push:
    paths:
      - .github/workflows/import.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built site
        run: |
          curl -fsSL -o index.html 'https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/10/73fa2a0d.html?expires=1794306487&sig=b9fc3346990a5bc3872efa80ccf754f1f3d39ba5fa0ec5f0f168fb05a9c08c0a'
          echo '7e0c94b2d5d0dfce04dbfdeb5df491352df68b78e1ad926313c89c4b59ec8cb5  index.html' | sha256sum -c -
          git rm -q .github/workflows/import.yml
      - name: Commit
        run: |
          git config user.name 'hhoshizora-usagi'
          git config user.email '333192191+hhoshizora-usagi@users.noreply.github.com'
          git add index.html
          git commit -m 'Add EPIC DAY.3 demo site (top + artist pages)'
          git push
